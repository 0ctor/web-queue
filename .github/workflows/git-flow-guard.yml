name: Git Flow Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

jobs:
  guard:
    name: Only dev/hotfix → main
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature → dev → main
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "dev" ]]; then exit 0; fi
          if [[ "$HEAD_REF" == hotfix/* || "$HEAD_REF" == fix/* ]]; then exit 0; fi
          echo "::error title=Git flow inválido::PR para main só pode vir de dev ou hotfix/fix."
          exit 1
