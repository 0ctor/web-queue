name: web-queue-dev

services:
  api:
    build:
      context: ./backend/v2
      dockerfile: Dockerfile
    ports:
      - "4545:4545"
    env_file:
      - .env
    environment:
      BACKEND_PORT: "4545"
    container_name: octor-web-queue-api

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5178"
    ports:
      - "5178:5178"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_PROXY_TARGET: http://api:4545
