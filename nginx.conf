server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v2/ {
        proxy_pass http://octor-web-queue-api:4545/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /health/ {
        proxy_pass http://octor-web-queue-api:4545/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
